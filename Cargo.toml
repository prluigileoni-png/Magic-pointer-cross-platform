[package]
name = "magic-pointer"
version = "0.1.0"
edition = "2021"
description = "Native Rust Magic Pointer companion for Windows and macOS"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
directories = "5"
image = { version = "0.24", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
screenshots = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
