name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package release
        shell: bash
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/magic-pointer${{ matrix.os == 'windows-latest' && '.exe' || '' }} package/
          cp config.example.json README.md package/
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp scripts/Start-MagicPointer.ps1 scripts/start-magic-pointer.cmd package/
          fi
          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            mkdir -p "Magic Pointer.app/Contents/MacOS" "Magic Pointer.app/Contents/Resources"
            cp target/${{ matrix.target }}/release/magic-pointer "Magic Pointer.app/Contents/MacOS/magic-pointer"
            cp packaging/macos/Info.plist "Magic Pointer.app/Contents/Info.plist"
            cp config.example.json README.md "Magic Pointer.app/Contents/Resources/"
            chmod +x "Magic Pointer.app/Contents/MacOS/magic-pointer"
            ditto -c -k --sequesterRsrc --keepParent "Magic Pointer.app" "magic-pointer-${{ matrix.target }}.app.zip"
          fi
          tar -czf magic-pointer-${{ matrix.target }}.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        if: matrix.target != 'aarch64-apple-darwin'
        with:
          name: magic-pointer-${{ matrix.target }}
          path: magic-pointer-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'aarch64-apple-darwin'
        with:
          name: magic-pointer-${{ matrix.target }}
          path: |
            magic-pointer-${{ matrix.target }}.tar.gz
            magic-pointer-${{ matrix.target }}.app.zip

  windows-installer:
    name: Windows x64 MSI
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows x64 binary
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Install WiX v4 CLI
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build MSI
        shell: pwsh
        run: |
          $wix = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          $version = if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $Matches[1] } else { "0.2.1" }
          & $wix build packaging/windows/MagicPointer.wxs `
            -d ProductVersion=$version `
            -d BinDir="$PWD\target\x86_64-pc-windows-msvc\release" `
            -d SourceDir="$PWD" `
            -d ScriptsDir="$PWD\scripts" `
            -o "$PWD\MagicPointer-x86_64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: magic-pointer-windows-x64-installer
          path: MagicPointer-x86_64.msi

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, windows-installer]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Flatten release assets
        shell: bash
        run: find release-assets -mindepth 2 -type f -exec cp {} release-assets/ \;
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
